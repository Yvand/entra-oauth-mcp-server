# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: entra-oauth-mcp-server
metadata:
  template: entra-oauth-mcp-server@1.0.0

services:
  mcp:
    project: .
    language: ts
    host: containerapp
    docker:
      remoteBuild: true
      path: ./Dockerfile
      context: .

hooks:
  # Best-effort cleanup before `azd down` removes deployment outputs from the environment.
  # See docs/operations.md for ownership checks, permanent purge, and the opt-out.
  predown:
    posix:
      shell: sh
      run: infra/hooks/predown-purge-entra-apps.sh
      continueOnError: true
      interactive: false
    windows:
      shell: pwsh
      run: infra/hooks/predown-purge-entra-apps.ps1
      continueOnError: true
      interactive: false
